services:
  - type: web
    name: finsight-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One worker on purpose. The response cache and the mock price engine both
    # live in process memory, so extra workers would each keep their own copy:
    # the cache would miss more often and prices would differ between requests.
    # Threads give concurrency instead, and share that memory.
    startCommand: gunicorn -w 1 --threads 4 --timeout 60 main:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # You will paste this manually in the Render dashboard
      # Firebase project whose ID tokens this API accepts. Every user-scoped
      # route rejects a token minted by any other project.
      - key: FIREBASE_PROJECT_ID
        value: finsight-f423d
      # Browser origins allowed to call the API. The native app is unaffected
      # by CORS; this is for the web build. Add the deployed web origin here.
      - key: ALLOWED_ORIGINS
        value: http://localhost:8081,http://127.0.0.1:8081
