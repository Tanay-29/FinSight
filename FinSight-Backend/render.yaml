services:
  - type: web
    name: finsight-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One worker on purpose. The response cache lives in process memory, so
    # extra workers would each keep their own copy and miss more often. Threads
    # give concurrency instead, and share it. The mock price engine that used to
    # share this reasoning is gone along with the rest of the brokerage.
    #
    # Nothing here is persisted any more, so a redeploy costs nothing but a cold
    # cache. That is the whole reason the SQLite layer was worth removing.
    startCommand: gunicorn -w 1 --threads 4 --timeout 120 main:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # You will paste this manually in the Render dashboard
      # Set here rather than in code because models get retired. When a request
      # starts coming back 404 saying the model is no longer available, this is
      # the one line to change, with no redeploy of the source.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Firebase project whose ID tokens this API accepts. Every user-scoped
      # route rejects a token minted by any other project.
      - key: FIREBASE_PROJECT_ID
        value: finsight-f423d
      # Browser origins allowed to call the API. The native app is unaffected
      # by CORS; this is for the web build. Add the deployed web origin here.
      - key: ALLOWED_ORIGINS
        value: http://localhost:8081,http://127.0.0.1:8081
